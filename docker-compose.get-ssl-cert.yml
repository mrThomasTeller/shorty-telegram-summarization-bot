volumes:
  web-certificates:

services:
  nginx:
    build: ./nginx
    env_file: ./.env
    environment:
      - GET_SSL_CERTIFICATE=true
    volumes:
      - './certbot/www:/var/www/certbot'
    ports:
      - '80:80'

  certbot:
    image: certbot/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot -d ${SERVER_NAME} --email ${EMAIL_FOR_SSL_NOTIFICATIONS} --agree-tos --no-eff-email --force-renewal
    volumes:
      - './certbot/www:/var/www/certbot'
      - 'web-certificates:/etc/letsencrypt'
    depends_on:
      - nginx
